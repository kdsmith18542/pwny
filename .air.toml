root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/pwny-server.exe"
  cmd = "go build -o ./tmp/pwny-server.exe ./cmd/pwny-server/"
  delay = 1000
  exclude_dir = ["assets", "tmp", "vendor", "bin", "node_modules", ".git"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  include_dir = []
  include_ext = ["go", "tpl", "tmpl", "html", "yaml", "yml", "toml"]
  kill_delay = 0
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  post_cmd = []
  pre_cmd = []
  rerun = false
  rerun_delay = 500
  send_interrupt = false
  stop_on_error = false

[color]
  app = ""
  build = "yellow"
  main = "green"
  runner = "cyan"
  watcher = "magenta"

[log]
  main_only = false
  time = false
